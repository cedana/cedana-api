syntax = "proto3";

package plugins.podman;

import "plugins/runc/runc.proto";

message Podman {
  string ID = 1; // container name or ID
  string Image = 2;
  repeated int32 GPUs = 3;
  repeated string Args = 4;
  repeated string Env = 5;

  optional plugins.runc.Runc Runc = 101;
  // Can add additional low-level runtimes here
}

message QueryReq {
  repeated string IDs = 1;
}

message QueryResp {
  repeated Podman Containers = 1;
}

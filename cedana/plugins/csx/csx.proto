syntax = "proto3";

package plugins.csx;

service CSX {
  rpc GetPath(GetPathReq) returns (GetPathResp) {}
  rpc ClosePath(ClosePathReq) returns (ClosePathResp) {}
}

enum Mode {
  READ_ONLY = 0;
  WRITE_ONLY = 1;
}

message GetPathReq {
  string ID = 1;
  Mode Mode = 2;
}

message GetPathResp {
  string ActionID = 1;
  string Path = 2;
}

message ClosePathReq {
  string ID = 1;
  string ActionID = 2;
  // In case of a write, if cancel is true the underlying object is deleted.
  bool Cancel = 3;
}

message ClosePathResp {}

syntax = "proto3";

package plugins.csx;

service CSX {
  rpc Create(CreateReq) returns (CreateResp) {}
  rpc Write(stream WriteReq) returns (WriteResp) {}
}

message CreateReq {
  string ID = 1;
}

message CreateResp {}

message WriteReq {
  string ID = 1;
  bytes chunks = 2;
}

message WriteResp {
  string error = 1;
}

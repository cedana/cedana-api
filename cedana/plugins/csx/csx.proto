syntax = "proto3";

package plugins.csx;

service CSX {
  rpc Create(CreateReq) returns (CreateResp) {}
  rpc Writer(stream WriteReq) returns (WriteResp) {}
  rcp Reader(ReadReq) returns (stream ReadReq) {}
}

message CreateReq {
  string ID = 1;
}

message CreateResp {}

message WriteReq {
  string ID = 1;
  bytes chunks = 2;
}

message WriteResp {
  string error = 1;
}

message ReadReq {
  string ID = 1;
}

message ReadResp {
  bytes chunks = 1;
}

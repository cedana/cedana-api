syntax = "proto3";

package plugins.csx;

service CSX {
  rpc Create(CreateReq) returns (CreateResp) {}
  rpc CloseWrite(CloseReq) returns (CloseResp) {}
  rpc CloseRead(CloseReq) return (CloseResp) {}
  rpc Open(OpenReq) returns (OpenResp) {}
}

message CreateReq {
  string ID = 1;
  uint64 Size = 2;
}

message CreateResp {
  string Path = 1;
}

message CloseReq {
  string ID = 1;
}

message CloseResp {}

message OpenReq {
  string ID = 1;
}

message OpenResp {
  string Path = 1;
}
